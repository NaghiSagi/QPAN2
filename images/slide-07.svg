<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="960" rx="32" fill="url(#bg)"/>
  <rect width="800" height="960" rx="32" fill="url(#grid)"/>
  <circle cx="660" cy="150" r="180" fill="#38bdf8" opacity="0.14"/>
  <circle cx="140" cy="800" r="220" fill="#f43f5e" opacity="0.12"/>
  
    <rect x="76" y="155" width="648" height="285" rx="24" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="3"/>
    <text x="118" y="220" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#ffffff">Xâm phạm tình dục (Đ.141 – 147)</text>
    <text x="118" y="275" font-family="Inter,sans-serif" font-size="44" font-weight="900" fill="#38bdf8">5 / 7 điều luật</text>
    <text x="118" y="328" font-family="Inter,sans-serif" font-size="22" fill="#e0f2fe">Bảo vệ đặc biệt người dưới 16 tuổi</text>
    <text x="118" y="366" font-family="Inter,sans-serif" font-size="22" fill="#bae6fd">và người từ đủ 13 đến dưới 16 tuổi</text>

    <rect x="76" y="475" width="648" height="285" rx="24" fill="rgba(244,63,94,0.15)" stroke="#fb7185" stroke-width="3"/>
    <text x="118" y="540" font-family="Inter,sans-serif" font-size="28" font-weight="800" fill="#ffffff">Mua bán người (Đ.150 – 154)</text>
    <text x="118" y="595" font-family="Inter,sans-serif" font-size="44" font-weight="900" fill="#fb7185">Cố ý trực tiếp</text>
    <text x="118" y="648" font-family="Inter,sans-serif" font-size="22" fill="#ffe4e6">Coi con người là hàng hóa kiếm lời</text>
    <text x="118" y="686" font-family="Inter,sans-serif" font-size="22" fill="#fecdd3">Bao gồm trẻ &lt;01 tuổi &amp; bộ phận cơ thể</text>
  
  <rect x="44" y="40" width="320" height="46" rx="23" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)"/>
  <text x="204" y="69" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1.4">NHÓM 1 &amp; NHÓM 2</text>
  <rect x="44" y="838" width="712" height="80" rx="18" fill="rgba(10,16,32,0.58)" stroke="rgba(255,255,255,0.18)"/>
  <text x="400" y="886" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#ffffff">BẢO VỆ TRẺ EM (&lt;16T) &amp; QUYỀN TỰ DO</text>
</svg>